seed: 42

data:
  dataset: bimodal_inner_speech
  experiment_name: bimodal_inner_speech_official_baselines
  root: data/bimodal_inner_speech
  task: inner_word
  subjects: [1, 2, 3, 5]
  sessions: [EEG]
  standardize: true
  n_electrode_groups: 4
  options:
    derivatives_root: derivatives/paper4/bimodal

preprocessing:
  official_code_source: official_preprocessing/bimodal
  output_root: derivatives/paper4/bimodal
  overwrite: false
  verbose: false

split:
  fold_indices: [0, 1, 2, 3]
  adapt_held_out_subjects: true

patch_timing:
  sampling_rate_hz: 512
  patch_seconds: 0.5
  stride_seconds: 0.25
  rounding: half_up
  right_pad_incomplete_patch: true

loader:
  batch_size: 64
  pin_memory: true

model:
  name: group4_patchLstm_deformableLstm
  kwargs:
    patch_size: 256
    patch_stride: 128
    pad_incomplete_patch: true
    n_electrode_groups: 4
    offset_lstm_hidden_size: 8
    offset_lstm_layers: 1
    offset_lstm_dropout: 0.0
    normalization: batchnorm

training:
  loss: cross_entropy
  label_smoothing: 0.05
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler:
    name: reduce_on_plateau
    monitor: loss
    factor: 0.5
    patience: 15
    min_learning_rate: 0.00001
  epochs: 100
  patience: 40
  monitor: accuracy
  device: cuda
  output_root: outputs/lr_hornet_reproduction

seed: 42

data:
  dataset: bimodal_inner_speech
  root: data/bimodal_inner_speech
  task: inner_word
  subjects: [1, 2, 3, 5]
  sessions: [EEG]
  standardize: true
  n_electrode_groups: 16
  options:
    derivatives_root: derivatives/paper4/bimodal

preprocessing:
  official_code_source: official_preprocessing/bimodal
  output_root: derivatives/paper4/bimodal
  overwrite: false
  verbose: false

split:
  fold_indices: [0, 1, 2, 3]
  adapt_held_out_subjects: true

loader:
  batch_size: 64
  pin_memory: true

baseline:
  n_channels: 64
  n_times: 359
  sfreq: 512.0
  n_electrode_groups: 16

model:
  name: braindecode_atcnet
  kwargs: {}

training:
  loss: cross_entropy
  label_smoothing: 0.0
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler:
    name: reduce_on_plateau
    monitor: loss
    factor: 0.5
    patience: 10
    min_learning_rate: 0.00001
  epochs: 100
  patience: 40
  monitor: accuracy
  device: cuda
  output_root: anxiliary/output

training:
  loss: cross_entropy
  label_smoothing: 0.05
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler:
    name: reduce_on_plateau
    monitor: loss
    factor: 0.5
    patience: 15
    min_learning_rate: 1.0e-05
  epochs: 100
  patience: 40
  monitor: accuracy
  device: cuda

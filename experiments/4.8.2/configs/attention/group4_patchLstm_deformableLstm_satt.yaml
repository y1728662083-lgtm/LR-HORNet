loader:
  batch_size: 32
  pin_memory: true
model:
  name: group4_patchLstm_deformableLstm_satt
  kwargs:
    patch_size: 128
    patch_stride: 64
    n_electrode_groups: 4
    offset_lstm_hidden_size: 8
    offset_lstm_layers: 1

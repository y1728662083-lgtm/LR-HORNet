seed: 42

data:
  dataset: bimodal_inner_speech
  root: data/bimodal_inner_speech
  task: inner_word
  subjects: [1, 2, 3, 5]
  sessions: [EEG]
  standardize: true
  n_electrode_groups: 16
  options:
    derivatives_root: derivatives/paper4/bimodal

preprocessing:
  # This is the authors' released preprocess.py, bundled as an immutable ZIP.
  official_code_zip: addition/official_preprocessing/bimodal_official.zip
  output_root: derivatives/paper4/bimodal
  overwrite: false
  verbose: false

split:
  fold_indices: [0, 1, 2, 3]
  adapt_held_out_subjects: true

input_adapter:
  source_sampling_rate_hz: 512
  target_sampling_rate_hz: 512
  patch_size_samples: 512
  patch_remainder: zero_pad

models:
  fast:
    enabled: true
    source: official_sources/FAST/FAST.py
    dim_cnn: 32
    dim_token: 32
    num_layers: 4
    num_heads: 8
    dropout: 0.1
    head: Conv4Layers
    # Official epochs are about 0.7 s, so use 0.5 s / 0.25 s windows.
    window_samples: 256
    stride_samples: 128
    window_remainder: nearest
    checkpoint: null
    training:
      batch_size: 16
      epochs: 100
      patience: 30
      learning_rate: 0.0005
      head_learning_rate_multiplier: 1.0
      weight_decay: 0.01
      label_smoothing: 0.0
      warmup_epochs: 10
      minimum_learning_rate: 0.00005
      gradient_accumulation_steps: 1
      gradient_clip_norm: 0.0
      amp: true

training:
  device: cuda
  monitor: accuracy
  pin_memory: true
  output_root: outputs/baselines/fast/bimodal_inner_speech

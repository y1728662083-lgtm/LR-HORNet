name: repository-checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.1
      - name: Validate portable repository contents
        run: python scripts/validate_repository.py
      - name: Compile Python sources
        run: python -m compileall -q main.py preprocessing.py src experiments figures scripts tests

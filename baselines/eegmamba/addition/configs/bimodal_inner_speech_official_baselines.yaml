seed: 42

data:
  dataset: bimodal_inner_speech
  root: data/bimodal_inner_speech
  task: inner_word
  subjects: [1, 2, 3, 5]
  sessions: [EEG]
  standardize: true
  n_electrode_groups: 16
  options:
    derivatives_root: derivatives/paper4/bimodal

split:
  fold_indices: [0, 1, 2, 3]
  adapt_held_out_subjects: true

input_adapter:
  # The released BDF and unchanged official preprocessing retain 512 Hz.
  source_sampling_rate_hz: 512
  target_sampling_rate_hz: 200
  patch_size_samples: 200
  patch_remainder: zero_pad

models:
  eegmamba:
    enabled: true
    source_root: official_sources/EEGMamba
    checkpoint: weights/pretrained_EEGMamba.pth
    checkpoint_required: true
    classifier: avgpooling_patch_reps
    training:
      batch_size: 32
      epochs: 50
      patience: 50
      seed: 3407
      learning_rate: 0.0001
      head_learning_rate_multiplier: 5.0
      weight_decay: 0.05
      label_smoothing: 0.1
      warmup_epochs: 0
      minimum_learning_rate: 0.000001
      gradient_accumulation_steps: 1
      gradient_clip_norm: 1.0
      amp: false
      scheduler: eegmamba_official_cosine
      selection_metric: cohen_kappa
      early_stopping: false
      train_drop_last: false
      eval_batch_size_multiplier: 1.0
      deterministic: true
      cudnn_benchmark: false

training:
  device: cuda:0
  monitor: accuracy
  pin_memory: true
  cpu_threads_per_process: 4
  cache_preprocessed_trials: true
  output_root: outputs/bimodal_inner_speech
